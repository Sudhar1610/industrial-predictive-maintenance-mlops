# Conda environment spec. This is the environment that gets frozen with
# `scripts/build_bundle.sh` (conda-pack) and carried to Stage 2/3, which
# are conda-only, no-pip, no-internet environments. Keep this in lockstep
# with pyproject.toml's [project.dependencies] -- conda-forge package
# names occasionally differ from PyPI names (noted inline below).
name: pdm
channels:
  - conda-forge
  - pytorch
  - nodefaults
dependencies:
  - python=3.11
  - pandas=2.2.2
  - numpy=1.26.4
  - scikit-learn=1.5.1
  - joblib=1.4.2
  - xgboost=2.1.1
  - pytorch=2.3.1
  - cpuonly # IIOT server is CPU-only; drop this line for a GPU box
  - pyyaml=6.0.2
  - python-dotenv=1.0.1
  - mlflow=2.15.1
  - prefect=2.20.2
  - fastapi=0.112.0
  - uvicorn=0.30.5
  - httpx=0.27.0
  - requests=2.32.3
  - loguru=0.7.2
  - prometheus-client=0.20.0
  - sqlalchemy=2.0.32
  - pymongo=4.8.0
  - dvc=3.53.2
  - pyodbc=5.1.0
  - psycopg2=2.9.9 # conda-forge name for psycopg2-binary
  - pytest=8.3.2
  - pytest-cov=5.0.0
  - pip=24.2 # kept only to install the two packages below at BUILD time
  - pip:
      # These two are not reliably packaged on conda-forge; they are
      # installed via pip ONLY during `scripts/build_bundle.sh`, which
      # runs on a machine WITH internet, before conda-pack freezes the
      # env. No pip install ever happens on Stage 2/3 machines themselves.
      - pandera==0.20.3
      - evidently==0.4.33
      - pydantic==2.8.2
      - pydantic-settings==2.4.0
