[project]
name = "pdm"
version = "0.1.0"
description = "Industrial Predictive Maintenance MLOps platform (C-MAPSS turbofan RUL + failure classification)"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",
    "xgboost==2.1.1",
    "torch==2.3.1",
    "pandera==0.20.3",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "mlflow==2.15.1",
    "prefect==2.20.2",
    # Pinned: prefect 2.20.2's internal task-group wrapper breaks against
    # anyio>=4.5 (AbstractMethodError on GatherTaskGroup). 4.4.0 is the
    # newest version confirmed compatible; do not let this float.
    "anyio==4.4.0",
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.5",
    "httpx==0.27.0",
    "requests==2.32.3",
    "loguru==0.7.2",
    "evidently==0.4.33",
    "prometheus-client==0.20.0",
    "sqlalchemy==2.0.32",
    "pymongo==4.8.0",
    "dvc==3.53.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.5.7",
    "mypy==1.11.1",
    "types-pyyaml==6.0.12.20240808",
    "types-requests==2.32.0.20240712",
]
sql = [
    "pyodbc==5.1.0",
    "psycopg2-binary==2.9.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=pdm --cov-report=term-missing"

[tool.coverage.run]
source = ["src/pdm"]
omit = ["*/serving/app.py"]
