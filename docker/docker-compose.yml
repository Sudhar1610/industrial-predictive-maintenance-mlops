# Full local stack for Stage 1 development: MLflow UI, Prefect server UI,
# the inference API, Prometheus, and Grafana. None of these are required
# for the application to function (see docs/adr/0003-local-mlflow-over-managed-registry.md
# and docs/STAGES.md) -- they're here for local visibility/demo purposes.
# `make up` / `make down` wrap this file.

services:
  mlflow-ui:
    image: python:3.11-slim
    working_dir: /mlflow
    volumes:
      - ../mlflow:/mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow==2.15.1 &&
             mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"

  prefect-server:
    image: prefecthq/prefect:2.20.2-python3.11
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serving
    ports:
      - "8000:8000"
    volumes:
      - ../configs:/app/configs:ro
      - ../mlflow:/app/mlflow
      - ../artifacts:/app/artifacts
      - ../data:/app/data:ro
      - ../logs:/app/logs
    environment:
      - PDM_CONFIG_DIR=/app/configs

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    volumes:
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

volumes:
  prefect-data:
  grafana-data:
