# Model and training configuration. Stage-independent: the same model
# config is used whether training data came from CSV, SQL, or MongoDB.

active_model: xgboost # sklearn_rf | xgboost | lstm

feature_engineering:
  rolling_windows: [5, 10, 20]
  lag_steps: [1, 2, 3]
  degradation_slope_window: 20
  sensor_columns:
    - sensor_2
    - sensor_3
    - sensor_4
    - sensor_7
    - sensor_8
    - sensor_9
    - sensor_11
    - sensor_12
    - sensor_13
    - sensor_14
    - sensor_15
    - sensor_17
    - sensor_20
    - sensor_21

classification:
  failure_horizon_cycles: 30 # label = 1 if RUL <= this many cycles remain
  target_metric: "f1"
  decision_threshold: 0.5

regression:
  target_metric: "rmse"
  rul_cap: 130 # standard C-MAPSS piecewise-linear RUL cap

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  random_state: 42

sklearn_rf:
  n_estimators: 200
  max_depth: 12
  random_state: 42

lstm:
  sequence_length: 30
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  random_state: 42

training:
  test_split: 0.2
  seed: 42

registry:
  tracking_uri: "sqlite:///mlflow/mlflow.db"
  artifact_location: "mlflow/artifacts"
  model_name: "pdm_turbofan"
  # Stage 3 fallback: read weights + metadata straight from disk with no
  # MLflow server running. See src/pdm/registry/local_artifact.py.
  local_fallback_path: "artifacts/production_model"
